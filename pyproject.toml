[tool.uv.workspace]
members = ["packages/*"]

# This is a virtual workspace root (no [project] table): rfdiffusion-gui is not
# itself an installable package, just a container for rfd-core, rfd-runner,
# and rfd-web (DD-1, Application Design Q1=A).
#
# ALL THREE packages target Python 3.9 (the container's interpreter, per U1).
#
# Corrected 2026-08-27 (U3 Code Generation Step 1): this comment previously claimed
# rfd-web targets >=3.11 and that "uv resolves each package's own environment
# independently". Both are wrong. A uv workspace has ONE lockfile and one
# requires-python intersection, and `uv lock` refuses a workspace whose members
# disagree. More fundamentally, rfd-web depends on rfd-core, which is capped at
# <3.10 so it can import inside the container -- so any environment that can import
# rfd-core is a 3.9 environment, login node included. rfd-web at >=3.11 was never
# installable. The login node's SYSTEM python3 (3.6.8) is indeed unusable; uv
# supplies 3.9 there, as docs/setup.md describes.
