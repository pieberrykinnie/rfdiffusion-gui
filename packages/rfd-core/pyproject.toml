[project]
name = "rfd-core"
version = "0.1.0"
description = "Pure, dependency-free domain logic for rfdiffusion-gui: contig parsing, design-mode inference, symmetry/iteration planning, Hydra argv assembly, and the run.json/progress.json record contracts."
readme = "README.md"
requires-python = ">=3.9,<3.10"
dependencies = [
    "pydantic>=2.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfd_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# CRITICAL: this package runs inside the container on Python 3.9 (U1), and its
# models are pydantic, which resolves string annotations at RUNTIME via
# eval() -- even under `from __future__ import annotations`. UP045/UP007
# (Optional[X] -> X | None, Union[X, Y] -> X | Y) are NOT gated by
# target-version: ruff considers the new syntax always safe to WRITE once
# future annotations are active, because it has no way to know a library will
# later eval() that string on an interpreter where `type.__or__` doesn't
# exist (added in 3.10). `ruff check --fix` applied this rewrite once,
# silently, and broke every pydantic model in this package at import time on
# 3.9 -- see audit.md, 2026-08-01. Do not remove this ignore, and do not
# apply `ruff check --fix` to this package without rerunning the test suite
# on Python 3.9 specifically afterwards.
ignore = ["UP045", "UP007"]
